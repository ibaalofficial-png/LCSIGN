name: Build Signed IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-signed-ipa:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        shell: bash
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          test -n "$XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Install signing certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          CERT_PATH="$RUNNER_TEMP/signing_certificate.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/ci-signing.keychain-db"

          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" \
            -P "$P12_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          PROFILE_UUID=$(
            security cms -D -i "$PROFILE_PATH" |
            /usr/libexec/PlistBuddy -c 'Print :UUID'
          )

          cp "$PROFILE_PATH" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

      - name: Read signing identity and profile
        shell: bash
        run: |
          set -euo pipefail

          IDENTITY=$(security find-identity -v -p codesigning "$RUNNER_TEMP/ci-signing.keychain-db" |
            awk -F'"' '/1\)/ {print $2; exit}')

          test -n "$IDENTITY"
          echo "CODE_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

          PROFILE_BUNDLE_ID=$(
            security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" |
            /usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier'
          )

          echo "Profile application identifier: $PROFILE_BUNDLE_ID"
          echo "Using signing identity: $IDENTITY"

      - name: Archive
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build

          xcodebuild archive \
            -project LCSignLab.xcodeproj \
            -scheme LCSignLab \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/LCSignLab.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$CODE_SIGN_IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            DEVELOPMENT_TEAM="${{ secrets.TEAM_ID }}" \
            | xcpretty

      - name: Export IPA
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build/export

          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${{ secrets.TEAM_ID }}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.ibaal.LCSignLab</key>
              <string>${PROFILE_UUID}</string>
            </dict>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$PWD/build/LCSignLab.xcarchive" \
            -exportPath "$PWD/build/export" \
            -exportOptionsPlist "$PWD/build/ExportOptions.plist" \
            | xcpretty

          test -f build/export/LCSignLab.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LCSignLab-IPA
          path: build/export/LCSignLab.ipa
          if-no-files-found: error

      - name: Cleanup signing material
        if: always()
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/ci-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/signing_certificate.p12"
          rm -f "$RUNNER_TEMP/profile.mobileprovision"
