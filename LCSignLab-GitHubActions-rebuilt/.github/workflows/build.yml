name: Build LCSignLab

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.0.app/Contents/Developer

      - name: Build
        run: |
          xcodebuild             -project LCSignLab.xcodeproj             -scheme LCSignLab             -configuration Release             -sdk iphoneos             -destination 'generic/platform=iOS'             CODE_SIGNING_ALLOWED=NO             clean build             | xcpretty

      - name: Package unsigned app
        run: |
          mkdir -p artifact
          APP=$(find ~/Library/Developer/Xcode/DerivedData -path '*/Build/Products/Release-iphoneos/LCSignLab.app' -print -quit)
          ditto "$APP" artifact/LCSignLab.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LCSignLab-unsigned
          path: artifact/LCSignLab.app
